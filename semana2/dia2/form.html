<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Formularios</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Registro de usuarios</h1>
    <form action="" method="">
        <p>Nombre
            <input type="text"  placeholder="Nombre">
        </p>
        <p>Email
            <input type="email" placeholder="E-mail">
        </p>
        <p>Fecha de nacimiento
            <input type="date">
        </p>
        <p>Ingrese su contraseña
            <input type="password" placeholder="contraseña">
        </p>
        <p>
            Masculino<input type="radio" name="genero">
            Femenino<input type="radio" name="genero">
        </p>
        <p>Paises</p>
        <select name="" id="">
            <option value="Li">Lima</option>
            <option value="Ca">Cajamarca</option>
            <option value="Piu">Piura</option>
            <option value="Ayac">Ayacucho</option>
            <option value="Tum">Tumbes</option>
        </select>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
